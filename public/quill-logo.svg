<svg width="1024" height="1024" viewBox="0 0 680 680" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Quill app logo</title>
  <desc>Quill PWA app icon — stylized quill feather on dark background</desc>

  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1C1A16"/>
      <stop offset="100%" stop-color="#0E0D0B"/>
    </radialGradient>
    <linearGradient id="featherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8E2D9"/>
      <stop offset="60%" stop-color="#C4A962"/>
      <stop offset="100%" stop-color="#8B6F2E"/>
    </linearGradient>
    <linearGradient id="nibGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C4A962"/>
      <stop offset="100%" stop-color="#6B4F1A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="680" height="680" rx="120" fill="url(#bgGlow)"/>

  <!-- Subtle texture lines -->
  <line x1="0" y1="340" x2="680" y2="340" stroke="#E8E2D9" stroke-width="0.3" stroke-opacity="0.04"/>
  <line x1="340" y1="0" x2="340" y2="680" stroke="#E8E2D9" stroke-width="0.3" stroke-opacity="0.04"/>

  <!-- Quill feather body -->
  <path d="M 420 110 
             C 480 130, 540 180, 530 260
             C 520 330, 470 370, 420 400
             C 380 425, 340 440, 300 470
             C 270 492, 255 515, 248 540
             L 240 570
             L 235 545
             C 240 520, 248 500, 262 478
             C 278 455, 300 435, 330 415
             C 370 388, 410 360, 440 320
             C 468 282, 478 240, 460 195
             C 445 158, 420 130, 390 118
             Z"
        fill="url(#featherGrad)" fill-opacity="0.95"/>

  <!-- Feather inner spine -->
  <path d="M 405 118 C 435 150, 450 210, 430 270 C 412 325, 370 360, 320 400 C 285 428, 258 460, 244 555"
        fill="none" stroke="#0E0D0B" stroke-width="2.5" stroke-opacity="0.4"/>

  <!-- Feather barbs -->
  <g stroke="#E8E2D9" stroke-width="1" stroke-opacity="0.25" fill="none">
    <line x1="408" y1="130" x2="370" y2="148"/>
    <line x1="425" y1="155" x2="378" y2="178"/>
    <line x1="438" y1="183" x2="385" y2="210"/>
    <line x1="446" y1="213" x2="390" y2="242"/>
    <line x1="448" y1="243" x2="392" y2="272"/>
    <line x1="445" y1="272" x2="394" y2="298"/>
    <line x1="438" y1="299" x2="394" y2="320"/>
    <line x1="426" y1="324" x2="388" y2="342"/>
    <line x1="412" y1="347" x2="378" y2="362"/>
    <line x1="395" y1="368" x2="364" y2="381"/>
    <line x1="374" y1="386" x2="346" y2="399"/>
    <line x1="352" y1="402" x2="326" y2="416"/>
    <line x1="328" y1="419" x2="303" y2="434"/>
    <line x1="304" y1="437" x2="280" y2="453"/>
    <line x1="280" y1="456" x2="260" y2="472"/>
  </g>

  <!-- Nib tip -->
  <path d="M 240 570 L 232 598 L 255 578 Z"
        fill="url(#nibGrad)"/>

  <!-- Ink drop at nib -->
  <ellipse cx="237" cy="600" rx="5" ry="7" fill="#C4A962" fill-opacity="0.7"/>

</svg>
